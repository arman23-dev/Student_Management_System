<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace= "~{fragments/layouts :: head}">

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layouts ::sidebar}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <div th:replace="~{fragments/layouts::navbar}"></div>


            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Courses</h2>
                    <a th:href="@{/course/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Add New
                        Course</a>
                </div>

                <div th:if="${message}" class="alert alert-danger text-center" role="alert" th:text="${message}" style="background-color: darkseagreen"></div>

                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <i class="bi bi-table me-1"></i> Course List
                    </div>
                    <div class="card-body">
                        <div class="text-muted" th:if="${course.content.isEmpty()}"></div>
                        <div class="table-responsive" th:if="${!course.content.isEmpty()}">
                            <table class="table table-hover table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Course Name</th>
										<th>Course Code</th>
										<th>Couse Fees</th>
                                        <th>Duration</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="course:${course}">
                                        <td data-label="ID" th:text="${course.id}"></td>
                                        <td data-label="Course Name" th:text="${course.courseName}"></td>
										<td data-label="Couse Code" th:text="${course.courseCode}"></td>
										<td data-label="Couse Fees" th:text="${course.fee}"></td>
                                        <td data-label="Duration" th:text="${course.duration}"></td>

                                        <td data-label="Actions">
                                            <a th:href="@{'/course/' + ${course.id}}" class="btn btn-sm btn-info text-white me-1"
                                               title="View"><i class="bi bi-eye"></i></a>
                                            <a th:href="@{/course/{id}/edit(id=${course.id})}" class="btn btn-sm btn-warning text-white me-1"
                                               title="Edit"><i class="bi bi-pencil"></i></a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
						<nav th:if="${course.totalPages>1}" aria-label="Course pagination">
						    <ul class="pagination justify-content-end">
						
						        <!-- Previous -->
						        <li class="page-item" th:classappend="${course.first}? 'disable'">
						            <a class="page-link" th:href="@{'/course/list'(page=${course.number>0 ? course.number-1:0}, size=${course.size})}">Previous</a>
						        </li>
						
						        <!-- Page numbers -->
						        <li class="page-item" th:each="pagesnum : ${#numbers.sequence(0,course.totalPages-1)}"
                                    th:classappend="${pagesnum} == ${course.number}? 'active' : '' ">
						            <a class="page-link" th:href="@{'/course/list'(page=${pagesnum},size=${course.size})}" th:text="${pagesnum+1}"></a>
						        </li>
						
						        <!-- Next -->
						        <li class="page-item" th:classappend="${course.first}? 'disable'">
                                    <a class="page-link" th:href="@{'/course/list'(page=${course.last? course.number:course.number+1}, size=${course.size})}">Next</a>
						        </li>
						
						    </ul>
						</nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layouts::scripts}"></div>

</body>

</html>
